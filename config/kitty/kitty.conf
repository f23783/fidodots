# ─────────────────────────────────────────────
# Kitty Terminal Configuration
# Hyprland + Matugen Integration
# ─────────────────────────────────────────────

# ── Font ──
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ── Transparency ──
# 0.0 = fully transparent, 1.0 = fully opaque
background_opacity 0.85
# Dim text when window loses focus (optional, looks clean)
dim_opacity 0.90
# Use blur with Hyprland (requires hyprland decoration config too)
# background_blur 1  # Kitty v0.36+

# ── Cursor ──
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5

# ── Scrollback ──
scrollback_lines 10000

# ── Mouse ──
mouse_hide_wait 3.0
url_style curly

# ── Window ──
window_padding_width 8
placement_strategy center
confirm_os_window_close 0

# ── Tab Bar ──
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2

# ── Performance ──
repaint_delay 6
input_delay 3
sync_to_monitor yes

# ── Bell ──
enable_audio_bell no
visual_bell_duration 0.0

# ── Include matugen-generated colors ──
# Matugen will generate this file automatically
include ~/.config/kitty/matugen-colors.conf
