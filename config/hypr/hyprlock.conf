# ─────────────────────────────────────────────
# Hyprlock Configuration
# ~/.config/hypr/hyprlock.conf
# ─────────────────────────────────────────────

source = ~/.config/hypr/colors.conf

general {
    grace = 3
    ignore_empty_input = true
    disable_loading_bar = false
}

# ── Arka Plan ──
background {
    monitor =
    path = screenshot
    blur_size = 4
    blur_passes = 3
    noise = 0.01
    contrast = 0.8
    brightness = 0.4
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# ── Saat ──
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $onSurface
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    shadow_passes = 3
    shadow_size = 8
    shadow_color = $shadow

    position = 0, 120
    halign = center
    valign = center
}

# ── Kullanıcı Adı ──
label {
    monitor =
    text = $USER
    color = $primary
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $shadow

    position = 0, 10
    halign = center
    valign = center
}

# ── Şifre Alanı (her zaman görünür) ──
input-field {
    monitor =
    size = 260, 45
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -2
    outer_color = $outlineVariant
    inner_color = $surfaceContainer
    font_color = $onSurface
    fade_on_empty = false
    fade_timeout = 0
    placeholder_text = <i>Input Password</i>
    fail_text = <i>Wrong Password</i>
    fail_color = $error
    check_color = $primary
    font_family = JetBrainsMono Nerd Font
    rounding = 22
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $shadow

    position = 0, -50
    halign = center
    valign = center
}
